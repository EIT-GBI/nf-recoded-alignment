[project]
name = "recoding-landscape"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "amiga>=3.0.4",
    "anndata>=0.12.10",
    "bio>=1.8.1",
    "ipykernel>=7.1.0",
    "jax>=0.5.3",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.0",
    "nbformat>=4.2.0",
    "nextflow>=25.10.4",
    "openpyxl>=3.1.5",
    "pandas>=2.2, <3.0",
    "plotly>=6.6.0",
    "pymc>=5.25.1",
    "pysam>=0.23.3",
    "pytensor>=2.31.7",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]
environments = [
  { sys_platform = "darwin", python_full_version = "3.12" }
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
