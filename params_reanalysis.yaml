# Reanalysis config: process selected samples across many NextSeq runs, driven by
# a samplesheet (built by ../linkage_mapping_refresh/reanalysis/). Run on the
# cluster:  nextflow run main.nf -params-file params_reanalysis.yaml -profile cluster -resume
#
# All paths below must be readable ON THE CLUSTER (not your Mac). Copy the
# samplesheet + references over, and adjust the paths/bind_mounts to match.

# Bind-mounted into every container. Must cover: the samplesheet's run_path root,
# the references, and the outdir.
bind_mounts:
  - '/mnt/gbi-shared/home/kim-eitgbi/LMB_data/SeqArchive_2025/Seq_2025'   # FASTQ runs
  - '/mnt/gbi-shared/home/kim-eitgbi/references'   # TODO: point at where the refs live on the cluster
  - '/mnt/gbi-shared/home/kim-eitgbi/reanalysis'   # TODO: where the samplesheet + outdir live

alignment:
  # One row per sample, all runs. run_path column points into the SeqArchive root above.
  samplesheet: '/mnt/gbi-shared/home/kim-eitgbi/reanalysis/pipeline_samplesheet.csv'
  recoded_ref: '/mnt/gbi-shared/home/kim-eitgbi/references/MDS42_r24-30_27B_SC.fasta'
  wt_ref:      '/mnt/gbi-shared/home/kim-eitgbi/references/MDS42_r24-30_27B_SC_wt.fasta'
  genbank:     '/mnt/gbi-shared/home/kim-eitgbi/references/MDS42_r24-30_27B_SC_recoded.gbk'
  outdir:      '/mnt/gbi-shared/home/kim-eitgbi/reanalysis/results/'
  threads: 8

qc:
  min_reads: 1000
  min_quality: 20
